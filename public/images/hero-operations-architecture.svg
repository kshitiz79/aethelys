  <text x="52" y="262" font-family="Inter, sans-serif" font-size="10.5" fill="#405264">• Clinical &amp; nursing support</text>
  <text x="52" y="280" font-family="Inter, sans-serif" font-size="10.5" fill="#405264">• Allied &amp; lab technicians</text>
  <text x="52" y="298" font-family="Inter, sans-serif" font-size="10.5" fill="#405264">• Role-based sourcing</text>
  <rect x="52" y="312" width="136" height="14" rx="7" fill="#E8F0F7"/>
  <text x="64" y="322" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" fill="#12304A">Structured Onboarding</text>

