  <!-- Pillar 3: Data Centre & IT -->
  <rect x="436" y="168" width="168" height="170" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="452" y="184" width="36" height="36" rx="9" fill="#DDF3F1"/>
  <rect x="460" y="192" width="20" height="8" rx="2" stroke="#138A8A" stroke-width="2"/>
  <rect x="460" y="204" width="20" height="8" rx="2" stroke="#138A8A" stroke-width="2"/>
  <text x="452" y="242" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="13" font-weight="700" fill="#12304A">Data Centre &amp; IT</text>
  <text x="452" y="262" font-family="Inter, sans-serif" font-size="10.5" fill="#405264">• Infrastructure consulting</text>
  <text x="452" y="280" font-family="Inter, sans-serif" font-size="10.5" fill="#405264">• Backup &amp; DR planning</text>
  <text x="452" y="298" font-family="Inter, sans-serif" font-size="10.5" fill="#405264">• HIS / EHR coordination</text>
