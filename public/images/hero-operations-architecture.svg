  <text x="252" y="262" font-family="Inter, sans-serif" font-size="10.5" fill="#405264">• Front-office &amp; helpdesk</text>
  <text x="252" y="280" font-family="Inter, sans-serif" font-size="10.5" fill="#405264">• Billing &amp; records support</text>
  <text x="252" y="298" font-family="Inter, sans-serif" font-size="10.5" fill="#405264">• Facility &amp; support teams</text>
