  <rect x="236" y="168" width="168" height="170" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="252" y="184" width="36" height="36" rx="9" fill="#DDF3F1"/>
  <rect x="261" y="193" width="18" height="18" rx="4" stroke="#138A8A" stroke-width="2"/>
