<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" fill="none" role="img" aria-label="Aethelys Healthcare B2B Operations and Infrastructure Architecture">
  <rect width="640" height="440" rx="20" fill="#F7FAFC"/>
  <rect x="1" y="1" width="638" height="438" rx="19" stroke="#D8E2EC" stroke-width="1.5"/>

  <!-- Subtle architectural grid -->
  <g opacity="0.45" stroke="#E2E8F0" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="440"/>
    <line x1="320" y1="0" x2="320" y2="440"/>
    <line x1="480" y1="0" x2="480" y2="440"/>
  </g>

  <!-- Central Institutional Hub -->
  <rect x="190" y="36" width="260" height="68" rx="14" fill="#12304A"/>
  <circle cx="222" cy="70" r="14" fill="#138A8A"/>
  <path d="M222 63V77M215 70H229" stroke="#F7FAFC" stroke-width="2.2" stroke-linecap="round"/>
  <text x="248" y="65" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Healthcare Institution</text>
  <text x="248" y="83" font-family="Inter, sans-serif" font-size="10.5" fill="#DDF3F1">Hospitals, Clinics &amp; Diagnostic Networks</text>

  <!-- Connectors -->
  <path d="M320 104V142" stroke="#138A8A" stroke-width="2"/>
  <path d="M120 142H520" stroke="#138A8A" stroke-width="2"/>
  <path d="M120 142V168" stroke="#138A8A" stroke-width="2"/>
  <path d="M320 142V168" stroke="#138A8A" stroke-width="2"/>
  <path d="M520 142V168" stroke="#138A8A" stroke-width="2"/>
  <circle cx="320" cy="142" r="4.5" fill="#12304A"/>
  <circle cx="120" cy="142" r="4" fill="#138A8A"/>
  <circle cx="520" cy="142" r="4" fill="#138A8A"/>

  <!-- Pillar 1: Workforce -->
  <rect x="36" y="168" width="168" height="170" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="52" y="184" width="36" height="36" rx="9" fill="#DDF3F1"/>
  <circle cx="70" cy="197" r="5" stroke="#138A8A" stroke-width="2"/>
  <path d="M61 211C61 206.5 65 204 70 204C75 204 79 206.5 79 211" stroke="#138A8A" stroke-width="2" stroke-linecap="round"/>
