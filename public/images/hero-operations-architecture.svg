  <text x="468" y="322" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" fill="#12304A">Continuity &amp; Support</text>

  <!-- Bottom Governance Foundation Bar -->
  <rect x="36" y="360" width="568" height="48" rx="12" fill="#E8F0F7" stroke="#CBD5E1" stroke-width="1"/>
  <text x="58" y="388" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#12304A">GOVERNANCE FOUNDATION:</text>
  <text x="225" y="388" font-family="Inter, sans-serif" font-size="11" fill="#405264">Clear Scope  ·  Dedicated Coordination  ·  Periodic Reviews  ·  Escalation Tiers</text>
