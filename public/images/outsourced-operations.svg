<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" fill="none" role="img" aria-label="Outsourced Healthcare Operations Accountability Matrix">
  <rect width="600" height="320" rx="16" fill="#F7FAFC"/>
  <rect x="1" y="1" width="598" height="318" rx="15" stroke="#D8E2EC" stroke-width="1.5"/>

  <text x="28" y="38" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="14" font-weight="700" fill="#12304A">Managed Support Operations &amp; Governance Model</text>
  <text x="28" y="57" font-family="Inter, sans-serif" font-size="11" fill="#405264">Clear separation of clinical oversight and structured non-clinical service execution</text>

  <!-- Left Card: Client Institution -->
  <rect x="28" y="80" width="254" height="210" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="28" y="80" width="254" height="36" rx="12" fill="#12304A"/>
  <rect x="28" y="104" width="254" height="12" fill="#12304A"/>
  <text x="44" y="103" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Healthcare Institution</text>
  <text x="44" y="140" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#12304A">• Clinical Care &amp; Policy Ownership</text>
  <text x="44" y="164" font-family="Inter, sans-serif" font-size="10.5" fill="#405264">• Institutional SOP &amp; compliance standards</text>
  <text x="44" y="186" font-family="Inter, sans-serif" font-size="10.5" fill="#405264">• HIS / billing system access governance</text>
  <text x="44" y="208" font-family="Inter, sans-serif" font-size="10.5" fill="#405264">• Designated operational point of contact</text>
  <text x="44" y="230" font-family="Inter, sans-serif" font-size="10.5" fill="#405264">• Periodic review &amp; feedback sign-off</text>
  <rect x="44" y="250" width="222" height="24" rx="6" fill="#E8F0F7"/>
  <text x="56" y="266" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#12304A">Retains full clinical &amp; medical authority</text>

  <!-- Right Card: Aethelys Delivery -->
  <rect x="318" y="80" width="254" height="210" rx="12" fill="#FFFFFF" stroke="#99D5D2"/>
  <rect x="318" y="80" width="254" height="36" rx="12" fill="#138A8A"/>
  <rect x="318" y="104" width="254" height="12" fill="#138A8A"/>
  <text x="334" y="103" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Aethelys Managed Services</text>
  <text x="334" y="140" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#12304A">• Structured Support Execution</text>
  <text x="334" y="164" font-family="Inter, sans-serif" font-size="10.5" fill="#405264">• Front-office, billing &amp; helpdesk rosters</text>
  <text x="334" y="186" font-family="Inter, sans-serif" font-size="10.5" fill="#405264">• Records, facility &amp; attendant coordination</text>
  <text x="334" y="208" font-family="Inter, sans-serif" font-size="10.5" fill="#405264">• On-ground supervision &amp; shift continuity</text>
  <text x="334" y="230" font-family="Inter, sans-serif" font-size="10.5" fill="#405264">• Monthly SLA &amp; attendance reporting</text>
  <rect x="334" y="250" width="222" height="24" rx="6" fill="#DDF3F1"/>
  <text x="346" y="266" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0E6E6E">Accountable to agreed scope &amp; SLAs</text>
</svg>
